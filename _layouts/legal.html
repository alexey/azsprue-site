<!doctype html>
<html lang="en">
<head>
  {% include head.html root="../" %}
  <title>{{ page.title }} – AzSprue</title>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased dark:bg-navy-deep dark:text-slate-100">
  <header class="bg-navy text-white">
    <nav class="mx-auto flex max-w-3xl items-center justify-between px-4 py-5 sm:px-6">
      <a href="../" class="flex items-center gap-3">
        <img src="../icon.png" alt="" class="h-9 w-9 rounded-xl ring-1 ring-white/10">
        <span class="font-semibold tracking-tight">AzSprue</span>
      </a>
      <a href="../#support" class="text-sm text-slate-300 hover:text-white">Support</a>
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-12 sm:px-6">
    <article class="prose prose-slate max-w-none rounded-3xl bg-white p-6 ring-1 ring-slate-200 prose-a:text-sprue sm:p-10 dark:prose-invert dark:bg-navy dark:ring-white/10 dark:prose-a:text-sprue-bright">
      {{ content }}
    </article>
  </main>

  <footer class="mx-auto flex max-w-3xl flex-col gap-3 px-4 pb-10 text-sm text-slate-500 sm:flex-row sm:justify-between sm:px-6 dark:text-slate-400">
    <span>© 2026 Alexey Zatsepin</span>
    <div class="flex gap-6">
      <a href="../privacy/" class="hover:text-slate-900 dark:hover:text-white">Privacy policy</a>
      <a href="../terms/" class="hover:text-slate-900 dark:hover:text-white">Terms of use</a>
    </div>
  </footer>
</body>
</html>
